<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABANGDOR - Login Pegawai</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-menu-utama.css">

    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-wrapper">
    <div class="login-header">
        <h2>SABANGDOR</h2>
        <p>Akses Khusus Kasir & Dapur</p>
    </div>

    <div class="login-card-box">
        <form id="loginForm">
            <div class="login-field-group">
                <label for="email">Email Pegawai</label>
                <input type="email" id="email" class="login-input-text" placeholder="kasir@sabangdor.com" required autocomplete="off">
            </div>

            <div class="login-field-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" class="login-input-text" required>
            </div>

            <p id="errorMessage" style="color: #ef4444; font-size: 12px; margin-bottom: 12px; display: none;"></p>

            <button type="submit" id="btnSubmit" class="login-btn-submit">Masuk</button>
        </form>
    </div>

    <a href="index.html" class="login-btn-back">← Kembali ke Menu Utama</a>
</div>

<script>
    // 1. Inisialisasi Supabase dengan nama variabel baru (supabaseClient)
    const SUPABASE_URL = 'https://gtspvslwoauifgurfkpx.supabase.co'; // URL Supabase Anda
    const SUPABASE_ANON_KEY = 'sb_publishable_kLlEvARJ8yWYNxU9fjN1uA_7faot8ie'; // Kunci Anon Supabase Anda

    // Gunakan window.supabase.createClient dan simpan ke supabaseClient
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    const btnSubmit = document.getElementById('btnSubmit');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (errorMessage) errorMessage.style.display = 'none';
        btnSubmit.disabled = true;
        btnSubmit.innerText = 'Memeriksa...';

        try {
            // 2. Panggil auth menggunakan supabaseClient
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                if (errorMessage) {
                    errorMessage.innerText = 'Email atau kata sandi salah!';
                    errorMessage.style.display = 'block';
                } else {
                    alert('Email atau kata sandi salah!');
                }
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'Masuk';
                return;
            }

            // 3. Login Berhasil -> Berpindah ke Dashboard Pegawai
            window.location.href = 'penjual-page/dashboard.html';

        } catch (err) {
            console.error(err);
            alert('Terjadi kesalahan sistem.');
            btnSubmit.disabled = false;
            btnSubmit.innerText = 'Masuk';
        }
    });
</script>

</body>
</html>
