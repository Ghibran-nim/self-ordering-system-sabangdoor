<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pegawai</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffffff;
            color: #000000;
        }

        .login-box {
            border: 1px solid #000000;
            padding: 24px;
            width: 280px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #000000;
            background: #ffffff;
            color: #000000;
            font-size: 14px;
            border-radius: 0;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-width: 2px;
            padding: 7px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #000000;
            color: #ffffff;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Login Pegawai</h2>
    <form action="penjual-page/dashboard.html" method="POST">
        <div class="form-group">
            <label for="username">Nama</label>
            <input type="text" id="username" name="username" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="password">Kata Sandi</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit">Masuk</button>
    </form>
</div>

</body>
</html>
