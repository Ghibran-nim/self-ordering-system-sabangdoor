<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABANGDOR - Login Pegawai</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Hubungkan ke file CSS Dashboard Utama milikmu -->
    <link rel="stylesheet" href="style-menu-utama.css">
</head>
<body>

<div class="login-wrapper">
    <div class="login-header">
        <h2>SABANGDOR</h2>
        <p>Akses Khusus Kasir & Dapur</p>
    </div>

    <div class="login-card-box">
        <form action="penjual-page/dashboard.html" method="POST">
            <div class="login-field-group">
                <label for="username">Nama</label>
                <input type="text" id="username" name="username" class="login-input-text" required autocomplete="off">
            </div>

            <div class="login-field-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" name="password" class="login-input-text" required>
            </div>

            <button type="submit" class="login-btn-submit">Masuk</button>
        </form>
    </div>

    <a href="index.html" class="login-btn-back">← Kembali ke Menu Utama</a>
</div>

</body>
</html>
