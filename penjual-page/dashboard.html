<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABANGDOR - Dashboard Penjual (Mobile)</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS Khusus Penjual -->
    <link rel="stylesheet" href="style-penjual.css">
</head>
<body>

    <div class="mobile-container">
        <!-- HEADER MERCHANT (Disesuaikan dengan gaya index.html) -->
        <div class="merchant-header-top">
            <div>
                <h2 class="main-header">SABANGDOR</h2>
                <h1 class="page-title" id="page-title">Manajemen Stok Menu</h1>
                <p class="page-subtitle" id="page-subtitle">Atur Ketersediaan Menu</p>
            </div>
            <div class="status-indicator">
                <span class="dot-live"></span>
                <span>Kasir Live</span>
            </div>
        </div>

        <!-- NAVBAR KATEGORI / TAB MENU (Desain Tab persis seperti index.html) -->
        <nav class="nav-tab-bar">
            <button class="tab-item active" onclick="navigate('dashboard', this)">
                <span class="tab-label">📦 Stok Menu</span>
            </button>
            <button class="tab-item" onclick="navigate('pembayaran', this)">
                <span class="tab-label">💳 Pembayaran</span>
                <span id="badge-notif-bayar" class="badge-notif" style="display:none;">0</span>
            </button>
            <button class="tab-item" onclick="navigate('pantau', this)">
                <span class="tab-label">🖥️ Pesanan</span>
            </button>
            <button class="tab-item" onclick="navigate('riwayat', this)">
                <span class="tab-label">📋 Riwayat</span>
            </button>
        </nav>

        <!-- MAIN CONTENT CONTAINER (SCROLLABLE AREA) -->
        <main class="merchant-body">
            
            <!-- SECTION 1: MANAJEMEN STOK MENU -->
            <section id="sec-dashboard" class="page-section active">
                <div id="grid-stok-menu" class="menu-container"></div>
            </section>

            <!-- SECTION 2: VERIFIKASI PEMBAYARAN -->
            <section id="sec-pembayaran" class="page-section">
                <div id="container-pembayaran" class="menu-container"></div>
            </section>

            <!-- SECTION 3: PANTAU PESANAN (KANBAN MOBILE) -->
            <section id="sec-pantau" class="page-section">
                <div class="kanban-mobile-tabs">
                    <button class="k-tab active" onclick="switchKanbanTab('terkirim', event)">Menunggu (<span id="count-terkirim">0</span>)</button>
                    <button class="k-tab" onclick="switchKanbanTab('diproses', event)">Dimasak (<span id="count-diproses">0</span>)</button>
                    <button class="k-tab" onclick="switchKanbanTab('selesai', event)">Disajikan (<span id="count-selesai">0</span>)</button>
                </div>

                <div id="kanban-content-mobile" class="menu-container"></div>
            </section>

            <!-- SECTION 4: RIWAYAT TRANSAKSI & OMZET -->
            <section id="sec-riwayat" class="page-section">
                <div id="summary-omzet-card" class="omzet-banner"></div>
                <div id="history-cards-container" class="menu-container"></div>
            </section>

        </main>
    </div>

    <!-- Script Khusus Penjual -->
    <script src="script-penjual.js"></script>
</body>
</html>
