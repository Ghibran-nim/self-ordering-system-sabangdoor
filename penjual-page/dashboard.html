<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABANGDOR - Dashboard Kasir</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-penjual.css">
    
</head>
<body>
    <div class="app">
        <!-- Header Kasir -->
        <header class="app-header">
            <div class="header-info">
                <span class="brand-tag">SABANGDOR POS</span>
                <h1 id="page-title">Manajemen Stok & QRIS</h1>
                <p id="page-subtitle">Atur Ketersediaan Menu & Gambar QRIS Toko</p>
            </div>
            <div class="live-badge">
                <span class="dot-live"></span> Live
            </div>
        </header>

        <!-- Main Body (Scroll Area) -->
        <main class="app-body">
            <!-- SECTION 1: STOK & QRIS -->
            <section id="sec-dashboard" class="page-section active">
                <div id="grid-stok-menu"></div>
            </section>

            <!-- SECTION 2: VERIFIKASI PEMBAYARAN -->
            <section id="sec-pembayaran" class="page-section">
                <div id="container-pembayaran"></div>
            </section>

            <!-- SECTION 3: DISPLAY KITCHEN -->
            <section id="sec-pantau" class="page-section">
                <div class="kitchen-tabs">
                    <button class="k-tab active" onclick="switchKitchenTab('proses-masak', event)">
                        Proses Masak (<span id="count-terkirim">0</span>)
                    </button>
                    <button class="k-tab" onclick="switchKitchenTab('selesai', event)">
                        Selesai (<span id="count-selesai">0</span>)
                    </button>
                </div>
                <div id="kanban-content-mobile"></div>
            </section>

            <!-- SECTION 5: MENU TAMBAHAN (kasir tambah menu sendiri) -->
            <section id="sec-menu" class="page-section">
                <div id="container-menu-tambahan"></div>
            </section>

            <!-- SECTION 4: RIWAYAT TRANSAKSI & OMZET -->
            <section id="sec-riwayat" class="page-section">
                <div class="card filter-card">
                    <label for="filterTanggal">📅 Filter Berdasarkan Tanggal</label>
                    <div class="filter-controls">
                        <input type="date" id="filterTanggal" onchange="renderCurrentSection(true)">
                        <button class="btn-reset" onclick="resetFilterTanggal()">Semua</button>
                    </div>
                </div>

                <div id="summary-omzet-card"></div>
                <div id="history-cards-container"></div>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="tab-item active" onclick="navigate('dashboard', this)">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                <span>Stok</span>
            </button>
            <button class="tab-item" onclick="navigate('pembayaran', this)">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                <span>Bayar</span>
                <span id="badge-notif-bayar" class="badge-count" style="display:none;">0</span>
            </button>
            <button class="tab-item" onclick="navigate('pantau', this)">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                <span>Dapur</span>
            </button>
            <button class="tab-item" onclick="navigate('menu', this)">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                <span>Menu</span>
            </button>
            <button class="tab-item" onclick="navigate('riwayat', this)">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                <span>Riwayat</span>
            </button>
        </nav>
    </div>

    <!-- 1. CDN Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Configuration File -->
    <script src="../config.js"></script>

    <!-- 3. Fitur Menu Tambahan (harus dimuat sebelum script-penjual.js) -->
    <script src="../menu-custom-store.js"></script>

    <script src="script-penjual.js"></script>
</body>
</html>
